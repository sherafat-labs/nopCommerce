version: '3.8'

services:
  nopcommerce_web:
    build: .
    container_name: nopcommerce
    ports:
      - "127.0.0.1:${NOP_COMMERCE_PORT:-8080}:80"
    depends_on:
      nopcommerce_database:
        condition: service_healthy
      postfix:
        condition: service_started
    environment:
      - ASPNETCORE_URLS=http://+:80
      - Nop__ServerProxySettings__ForwardedProtoHeader=${NOP_FORWARDED_PROTO_HEADER}
      - Nop__Data__DbHost=${POSTGRES_HOST}
      - Nop__Data__DbName=${POSTGRES_DB}
      - Nop__Data__DbUsername=${POSTGRES_USER}
      - Nop__Data__DbPassword=${POSTGRES_PASSWORD}
      - Nop__Data__DbPort=${POSTGRES_PORT}
      - Nop__Data__DbCommandTimeout=${DB_COMMAND_TIMEOUT:-300}
      - Nop__Data__DbConnectionTimeout=${DB_CONNECTION_TIMEOUT:-30}
      - Nop__Data__DbProvider=postgresql
      # Email Configuration for Postfix
      - Nop__EmailSettings__DefaultEmailAddressFrom=${EMAIL_FROM}
      - Nop__EmailSettings__DefaultEmailDisplayName=${EMAIL_DISPLAY_NAME}
      - Nop__EmailSettings__Host=postfix
      - Nop__EmailSettings__Port=25
      - Nop__EmailSettings__Username=${SMTP_USERNAME}
      - Nop__EmailSettings__Password=${SMTP_PASSWORD}
      - Nop__EmailSettings__EnableSsl=false
    networks:
      - ${DOCKER_NETWORK:-nopnetwork}
    restart: unless-stopped

  nopcommerce_database:
    image: "postgres:${POSTGRES_VERSION:-16}"
    container_name: nopcommerce_postgres_server
    restart: "always"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --data-checksums"
    volumes:
      - ${POSTGRES_VOLUME:-postgres_data}:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - ${DOCKER_NETWORK:-nopnetwork}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postfix:
    image: boky/postfix
    container_name: nopcommerce_postfix
    environment:
      - ALLOWED_SENDER_DOMAINS=stoneb2b.ir
      - RELAYHOST=[smtp.gmail.com]:587
      - RELAYHOST_USERNAME=${SMTP_USERNAME}
      - RELAYHOST_PASSWORD=${SMTP_PASSWORD}
    networks:
      - ${DOCKER_NETWORK:-nopnetwork}
    restart: unless-stopped

networks:
  nopnetwork:
    driver: bridge
    name: ${DOCKER_NETWORK:-nopnetwork}

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-postgres_data}